<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F4DC"/>
      <stop offset="1" stop-color="#D6E0AE"/>
    </linearGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
    </filter>
  </defs>

  <g filter="url(#rough)">
    <rect x="12" y="12" width="276" height="576" fill="url(#sky)"/>

    <!-- far trunks -->
    <g fill="#B9C39A" opacity=".55">
      <rect x="28" y="40" width="12" height="420"/>
      <rect x="96" y="40" width="10" height="420"/>
      <rect x="176" y="40" width="12" height="420"/>
      <rect x="252" y="40" width="10" height="420"/>
    </g>
    <!-- near trunks -->
    <g fill="#9FAB82" opacity=".75">
      <rect x="58" y="40" width="20" height="430"/>
      <rect x="132" y="40" width="14" height="430"/>
      <rect x="212" y="40" width="22" height="430"/>
    </g>

    <!-- canopy -->
    <g fill="#C9D59A" opacity=".85">
      <ellipse cx="50" cy="48" rx="96" ry="30"/>
      <ellipse cx="220" cy="40" rx="100" ry="34"/>
      <ellipse cx="140" cy="92" rx="86" ry="22"/>
    </g>
    <g fill="#DCE5B4" opacity=".8">
      <ellipse cx="70" cy="150" rx="70" ry="18"/>
      <ellipse cx="230" cy="190" rx="66" ry="16"/>
      <ellipse cx="120" cy="250" rx="80" ry="16"/>
      <ellipse cx="40" cy="330" rx="60" ry="14"/>
    </g>

    <!-- hills -->
    <path d="M12 430 Q150 372 288 430 V588 H12Z" fill="#B3C675"/>
    <path d="M12 486 Q130 450 288 494 V588 H12Z" fill="#94AD5A"/>

    <!-- grass tufts -->
    <g stroke="#7C9847" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M40 520 q2 -14 -6 -20 M40 520 q4 -12 10 -16"/>
      <path d="M250 530 q-2 -14 6 -20 M250 530 q-4 -12 -10 -16"/>
      <path d="M215 565 q0 -12 -6 -16 M215 565 q4 -10 9 -12"/>
      <path d="M70 560 q0 -12 -6 -16 M70 560 q4 -10 9 -12"/>
    </g>

    <!-- flowers -->
    <g>
      <g transform="translate(60 505)"><circle r="5" fill="#fff"/><circle r="2" fill="#F2C94C"/></g>
      <g transform="translate(236 500)"><circle r="5" fill="#FBE3E3"/><circle r="2" fill="#F2C94C"/></g>
      <g transform="translate(34 560)"><circle r="4" fill="#fff"/><circle r="1.6" fill="#F2C94C"/></g>
      <g transform="translate(262 566)"><circle r="4" fill="#FBE3E3"/><circle r="1.6" fill="#F2C94C"/></g>
      <g transform="translate(190 540)"><circle r="3.5" fill="#fff"/><circle r="1.4" fill="#F2C94C"/></g>
    </g>

    <!-- dog -->
    <g transform="translate(150 462)">
      <!-- tail -->
      <path d="M40 46 Q86 30 72 -4" stroke="#E8A25C" stroke-width="15" stroke-linecap="round" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="-8 40 46;10 40 46;-8 40 46" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <!-- body -->
      <ellipse cx="0" cy="40" rx="44" ry="38" fill="#E8A25C"/>
      <ellipse cx="0" cy="52" rx="25" ry="25" fill="#FBEBD0"/>
      <ellipse cx="-17" cy="74" rx="12" ry="8" fill="#FBEBD0"/>
      <ellipse cx="17" cy="74" rx="12" ry="8" fill="#FBEBD0"/>
      <!-- scarf -->
      <path d="M-36 30 Q0 50 36 30 L32 44 Q0 62 -32 44Z" fill="#B5483F"/>
      <path d="M14 46 L24 64 L10 62Z" fill="#9C3A32"/>
      <!-- ears -->
      <path d="M-46 -26 L-52 -82 L-14 -50Z" fill="#E8A25C"/>
      <path d="M-42 -40 L-45 -68 L-26 -50Z" fill="#F7C9A0"/>
      <path d="M46 -26 L52 -82 L14 -50Z" fill="#E8A25C"/>
      <path d="M42 -40 L45 -68 L26 -50Z" fill="#F7C9A0"/>
      <!-- head -->
      <ellipse cx="0" cy="-8" rx="54" ry="44" fill="#E8A25C"/>
      <ellipse cx="0" cy="6" rx="35" ry="25" fill="#FBEBD0"/>
      <circle cx="-22" cy="-30" r="4" fill="#FBEBD0"/>
      <circle cx="22" cy="-30" r="4" fill="#FBEBD0"/>
      <!-- cheeks -->
      <circle cx="-36" cy="6" r="8" fill="#F4A68C" opacity=".5"/>
      <circle cx="36" cy="6" r="8" fill="#F4A68C" opacity=".5"/>
      <!-- eyes -->
      <ellipse cx="-21" cy="-10" rx="5" ry="5.5" fill="#4A3426">
        <animate attributeName="ry" values="5.5;5.5;5.5;0.6;5.5" keyTimes="0;0.6;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="21" cy="-10" rx="5" ry="5.5" fill="#4A3426">
        <animate attributeName="ry" values="5.5;5.5;5.5;0.6;5.5" keyTimes="0;0.6;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="-19.5" cy="-12" r="1.8" fill="#fff"/>
      <circle cx="22.5" cy="-12" r="1.8" fill="#fff"/>
      <!-- nose / mouth -->
      <ellipse cx="0" cy="0" rx="6.5" ry="4.5" fill="#4A3426"/>
      <path d="M0 4 V10 M0 10 Q-8 17 -15 10 M0 10 Q8 17 15 10" stroke="#4A3426" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M-5 14 Q0 30 5 14Z" fill="#F28B8B"/>
    </g>

    <!-- falling leaves -->
    <g>
      <ellipse rx="6" ry="3" fill="#C98F4B" opacity=".85" transform="translate(70 30)">
        <animateMotion path="M0,0 C30,120 -30,260 20,420" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="5" ry="2.5" fill="#D9A95E" opacity=".85" transform="translate(190 20)">
        <animateMotion path="M0,0 C-30,100 30,240 -10,400" dur="11s" begin="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="5" ry="2.5" fill="#B9C06A" opacity=".9" transform="translate(120 10)">
        <animateMotion path="M0,0 C40,140 -20,260 30,440" dur="13s" begin="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
